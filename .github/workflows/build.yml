
name: EduForge Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install Dependencies and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install missing project dependencies automatically
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm install --include=dev
          fi

      # Check required project files
      - name: Validate Project
        run: |
          test -f package.json
          test -f index.html
          test -d src
          node -e "const p=require('./package.json'); if (!p.scripts?.build) process.exit(1)"

      # TypeScript validation
      - name: TypeScript Check
        run: npx --no-install tsc -b

      # Production build
      - name: Build Project
        run: npm run build

      # Save build output
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduforge-frontend-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
          
