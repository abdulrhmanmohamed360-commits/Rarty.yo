
name: EduForge Auto Install and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project Files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Project Files
        run: |
          test -f package.json || {
            echo "ERROR: package.json is missing"
            exit 1
          }

          test -f index.html || {
            echo "ERROR: index.html is missing"
            exit 1
          }

          test -d src || {
            echo "ERROR: src folder is missing"
            exit 1
          }

      - name: Install All Declared Dependencies
        run: |
          npm install --include=dev --no-audit --no-fund

      - name: Repair Missing Build Tools
        run: |
          npm install --save-dev \
            typescript \
            vite \
            @vitejs/plugin-react \
            --no-audit --no-fund

      - name: TypeScript Check
        run: npx tsc -b

      - name: Build Project
        run: npm run build

      - name: Upload Build Files
        uses: actions/upload-artifact@v4
        with:
          name: eduforge-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
          
