name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Downloads any missing dependency automatically
      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor if missing
        run: |
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6
      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.eduforge.app","appName":"EduForge","webDir":"dist"}' > capacitor.config.json
          fi
      - name: Build web app
        run: npx vite build

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduForge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
