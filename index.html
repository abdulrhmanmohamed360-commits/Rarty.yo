<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d"><title>CHAOS ROOM</title>
<link rel="stylesheet" href="style.css"></head>
<body data-scene="menu" data-lang="en">
<canvas id="bg"></canvas><div id="fade"></div><div id="ach"></div><div id="rc"></div>
<div id="stage"><canvas id="c" width="480" height="352"></canvas></div>
<div id="hud"><div id="hl"><b id="hlv"></b><span id="hkey"><i class="ic" data-ic="key"></i><span class="t"></span></span><span id="hcoin"><i class="ic" data-ic="coin"></i><span class="t"></span></span></div>
<div id="chaos"><div id="cn"><i class="ic" id="cni"></i><span class="t"></span></div><div id="cs"></div><div id="cb"><i id="cbi"></i></div></div>
<div id="hr"><b id="ht"><i class="ic" data-ic="clock"></i><span class="t">0.0</span></b><button data-a="pause" class="sm"><i class="ic" data-ic="pause"></i></button></div></div>
<div id="toast"></div>
<div id="touch"><div id="joy"><i id="knob"></i></div><button id="act" data-i="act"></button></div>
<section class="screen" id="menu"><h1 id="logo" data-i="logo"></h1><p class="sub" data-i="tag"></p>
<button class="big" data-a="play"><i class="ic" data-ic="play"></i><span data-i="play"></span></button><div class="row"><button data-a="levels" data-i="levels"></button><button data-a="lb" data-i="lb"></button></div>
<div class="row"><button data-a="settings" data-i="settings"></button><button data-a="how" data-i="how"></button></div><p class="hint" data-i="hint"></p></section>
<section class="screen" id="levels"><h2 data-i="rooms"></h2><div id="lvl"></div><button data-a="menu" data-i="back"></button></section>
<section class="screen" id="settings"><h2 data-i="settings"></h2>
<label class="sl"><span data-i="music"></span><input type="range" id="vm" min="0" max="100"></label><label class="sl"><span data-i="sfx"></span><input type="range" id="vs" min="0" max="100"></label>
<div class="row"><button data-a="music" id="bm"></button><button data-a="sfx" id="bs"></button></div>
<h3 data-i="lang"></h3><div class="row"><button data-a="lang" data-l="ar">العربية</button><button data-a="lang" data-l="en">English</button></div>
<button data-a="lefty" id="blf"></button><button data-a="auto" id="bau"></button><button data-a="tut" data-i="tutrep"></button><button data-a="reset" class="warn" data-i="reset"></button><button data-a="menu" data-i="back"></button></section>
<section class="screen" id="pause"><h2 data-i="paused"></h2><button data-a="resume" data-i="resume"></button><button data-a="restart" data-i="restart"></button>
<button data-a="settings2" data-i="settings"></button><button data-a="menu" data-i="menu"></button></section>
<section class="screen" id="over"><h2 class="bad" data-i="died"></h2><p id="why"></p><button data-a="retry" data-i="retry"></button><button data-a="restart" data-i="restart"></button><button data-a="menu" data-i="menu"></button></section>
<section class="screen" id="done"><h2 class="good" data-i="cleared"></h2><p id="dtxt"></p><button data-a="next" data-i="next"></button><button data-a="restart" data-i="replay"></button><button data-a="menu" data-i="menu"></button></section>
<section class="screen" id="victory"><h2 class="good" data-i="escaped"></h2><p id="vtxt"></p><button data-a="restart" data-i="replaylast"></button><button data-a="levels" data-i="levels"></button><button data-a="menu" data-i="menu"></button></section>
<section class="screen" id="lb"><h2 data-i="lbt"></h2><input id="lbn" maxlength="16" data-ph="lbname">
<p id="lbme" class="sub"></p><div id="lbl"></div><h3 data-i="ach"></h3><div id="lba"></div><button data-a="menu" data-i="back"></button></section>
<section class="screen" id="how"><h2 data-i="howt"></h2><div class="card"><p><i class="ic" data-ic="target"></i><span data-i="how1"></span></p><p><i class="ic" data-ic="move"></i><span data-i="how2"></span></p><p><i class="ic" data-ic="hand"></i><span data-i="how3"></span></p><p><i class="ic" data-ic="bolt"></i><span data-i="how4"></span></p><p><i class="ic" data-ic="spikes"></i><span data-i="how5"></span></p><p><i class="ic" data-ic="gem"></i><span data-i="how6"></span></p></div><button data-a="menu" data-i="back"></button></section>
<section class="screen" id="tut"><div id="tic"></div><h2 id="tti"></h2><p id="ttx" class="sub"></p><div id="tdots"></div>
<div class="row"><button data-a="tback" id="tback" data-i="tback"></button><button data-a="tnext" id="tnb"></button></div><button data-a="tskip" class="ghost" data-i="tskip"></button>
<label class="ck"><input type="checkbox" id="tck" checked> <span data-i="tdont"></span></label></section>
<script src="i18n.js"></script><script src="icons.js"></script><script src="levels.js"></script><script src="audio.js"></script><script src="api.js"></script><script src="game.js"></script>
</body></html>
